
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#020711">
<title>JEVIS AI</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle,#082c49,#020711 65%);color:#b9f5ff;font-family:Arial;text-align:center;min-height:100vh;padding:25px 15px}
h1{letter-spacing:8px;color:#42dfff;text-shadow:0 0 20px #008cff}
#clock{font-size:38px;letter-spacing:5px;margin-top:30px}
.small{font-size:11px;letter-spacing:3px;color:#6ca9c5}
.core{width:220px;height:220px;border:2px solid #29dfff;border-radius:50%;margin:45px auto 25px;display:grid;place-items:center;box-shadow:0 0 25px #008cff,inset 0 0 30px #087cff;position:relative;animation:glow 3s infinite}
.core:before,.core:after{content:"";position:absolute;border:1px dashed #29dfff;border-radius:50%;inset:13px;animation:spin 15s linear infinite}
.core:after{inset:32px;animation-direction:reverse}
.j{font-size:85px;color:#bafaff;text-shadow:0 0 25px #00aaff}
button{background:#061d32;border:1px solid #29dfff;color:#b9f5ff;padding:16px;border-radius:8px;width:100%;font-size:13px;letter-spacing:2px;margin:7px 0}
button:active{background:#075078}
.panel{max-width:440px;margin:auto}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes glow{50%{box-shadow:0 0 45px #008cff,inset 0 0 45px #087cff}}
</style>
</head>
<body>
<h1>JEVIS</h1>
<div class="small">PERSONAL INTELLIGENCE SYSTEM</div>
<div id="clock">00:00:00</div>
<div class="small">SYSTEM ONLINE</div>
<div class="core"><div class="j">J</div></div>
<div class="small">AWAITING COMMAND, SIR</div>
<div class="panel">
<button onclick="ask('Hello JEVIS. Introduce yourself.')">◉ ACTIVATE JEVIS</button>
<button onclick="ask('Help me plan my day.')">01 / PERSONAL ASSISTANT</button>
<button onclick="ask('Help me research something.')">02 / INTELLIGENCE</button>
<button onclick="ask('Help me organise my tasks.')">03 / PRODUCTIVITY</button>
<button onclick="ask('Help me solve a problem.')">04 / ANALYSIS</button>
</div>
<div class="small" style="margin-top:25px">JEVIS SYSTEMS • EXECUTIVE MODE</div>
<script>
function update(){document.getElementById('clock').textContent=new Date().toLocaleTimeString()}
setInterval(update,1000);update();
function ask(q){location.href='https://chatgpt.com/?q='+encodeURIComponent(q)}
</script>
</body>
</html>
